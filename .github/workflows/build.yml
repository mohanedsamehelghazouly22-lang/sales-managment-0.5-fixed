name: Build Sales Manager (Android + Windows)

# ازاي تشغّله:
# 1) ضع هذا الملف في مشروعك على المسار: .github/workflows/build.yml
# 2) من إعدادات الريبو على GitHub: Settings > Secrets and variables > Actions
#    أضف Secret باسم SUPABASE_URL وقيمته رابط مشروع Supabase
#    أضف Secret باسم SUPABASE_PUBLISHABLE_KEY وقيمته الـ publishable/anon key
#    (لا تضع service_role key هنا نهائيًا)
# 3) أي Push على main أو أي Tag يبدأ بـ v (زي v0.5.0) هيشغّل البناء تلقائيًا،
#    أو تقدر تشغّله يدويًا من تبويب Actions زر Run workflow.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: stable
  PROJECT_DIR: sales_manager_v0.5

jobs:
  analyze:
    name: Analyze & format check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sales_manager_v0.5
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: تحقق من التنسيق (dart format)
        run: dart format --output=none --set-exit-if-changed lib
        continue-on-error: true

      - name: flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

  build-android:
    name: Build Android APK
    needs: analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sales_manager_v0.5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE || '~/.pub-cache' }}
          key: pub-${{ runner.os }}-${{ hashFiles('sales_manager_v0.5/pubspec.yaml') }}

      - name: flutter pub get
        run: flutter pub get

      - name: توليد مشروع Android (لو غير موجود)
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --project-name=sales_manager --org=com.salesmanager
          fi

      - name: تجهيز Android لإشعارات flutter_local_notifications
        run: python3 tool/patch_android.py

      - name: flutter build apk --release
        run: |
          flutter build apk --release \
            --split-per-abi \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

      - name: رفع ملفات APK كمخرجات
        uses: actions/upload-artifact@v4
        with:
          name: sales-manager-android-apk
          path: sales_manager_v0.5/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30

  build-windows:
    name: Build Windows exe
    needs: analyze
    runs-on: windows-latest
    defaults:
      run:
        working-directory: sales_manager_v0.5
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE || '~/AppData/Local/Pub/Cache' }}
          key: pub-${{ runner.os }}-${{ hashFiles('sales_manager_v0.5/pubspec.yaml') }}

      - name: flutter pub get
        run: flutter pub get

      - name: توليد مشروع Windows (لو غير موجود)
        shell: pwsh
        run: |
          if (!(Test-Path "windows")) {
            flutter create . --platforms=windows --project-name=sales_manager --org=com.salesmanager
          }

      - name: flutter config --enable-windows-desktop
        run: flutter config --enable-windows-desktop

      - name: flutter build windows --release
        run: >
          flutter build windows --release
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

      - name: ضغط مخرجات ويندوز في zip
        shell: pwsh
        run: |
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "sales-manager-windows.zip"

      - name: رفع نسخة ويندوز كمخرجات
        uses: actions/upload-artifact@v4
        with:
          name: sales-manager-windows
          path: sales_manager_v0.5/sales-manager-windows.zip
          if-no-files-found: error
          retention-days: 30
